services:
  # Futuro AI Express Backend Web Service
  - type: web
    name: futuro-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 9949998046-54secmerttj8cn7mr4pq43gndcq9h76r.apps.googleusercontent.com
